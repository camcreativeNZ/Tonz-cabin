<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tonz Cabin – Barber view</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f3ee;color:#1f2328}
header{background:#2b2b2b;color:#fff;text-align:center;padding:18px}
header h1{margin:0;font-size:1.4rem;letter-spacing:.06em;text-transform:uppercase}
header span{color:#b8873b}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e4dfd6;border-radius:14px;padding:16px;margin-bottom:14px}
input{width:100%;padding:13px;border:1px solid #e4dfd6;border-radius:10px;font-size:1rem}
button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer}
.go{background:#1f9d55;color:#fff;margin-top:10px;width:100%}
.del{background:#fbe6e6;color:#9b2121;padding:8px 12px;font-size:.85rem}
h3{margin:18px 0 8px;font-size:1rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #eee}
.row small{color:#6b7177;display:block}
.err{color:#d63b3b;margin-top:8px}
</style>
</head>
<body>
<header><h1>Tonz <span>Cabin</span> · Barber view</h1></header>
<main>
  <div class="card" id="login">
    <label for="pin"><strong>Admin PIN</strong></label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="go" id="go">View bookings</button>
    <div class="err" id="err"></div>
  </div>
  <div id="list"></div>
</main>
<script>
var pin='';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(t){var h=+t.slice(0,2),m=t.slice(3),s=h>=12?'pm':'am';h=h%12||12;return h+':'+m+' '+s}
function pretty(s){var p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2])).toLocaleDateString('en-NZ',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})}
function load(){
  fetch('/api/bookings?all=1',{headers:{'x-admin-pin':pin},cache:'no-store'}).then(function(r){
    if(r.status===401){document.getElementById('err').textContent='Wrong PIN, or ADMIN_PIN is not set in Netlify yet.';return null}
    if(!r.ok){document.getElementById('err').textContent='Could not load bookings.';return null}
    return r.json();
  }).then(function(j){
    if(!j)return;
    document.getElementById('login').style.display='none';
    var el=document.getElementById('list');
    if(!j.bookings.length){el.innerHTML='<div class="card">No upcoming bookings.</div>';return}
    var html='',last='';
    j.bookings.forEach(function(b){
      if(b.date!==last){if(last)html+='</div>';html+='<div class="card"><h3 style="margin-top:0">'+pretty(b.date)+'</h3>';last=b.date}
      html+='<div class="row"><div><strong>'+fmt(b.time)+'</strong> · '+esc(b.name)+(b.phone?'<small>'+esc(b.phone)+'</small>':'')+'</div>'+
        '<button class="del" data-d="'+b.date+'" data-t="'+b.time+'">Cancel</button></div>';
    });
    el.innerHTML=html+'</div>';
    Array.prototype.forEach.call(el.querySelectorAll('.del'),function(b){
      b.onclick=function(){
        if(!confirm('Cancel this booking?'))return;
        fetch('/api/bookings',{method:'DELETE',headers:{'x-admin-pin':pin,'Content-Type':'application/json'},body:JSON.stringify({date:b.dataset.d,time:b.dataset.t})}).then(load);
      };
    });
  });
}
document.getElementById('go').onclick=function(){pin=document.getElementById('pin').value;document.getElementById('err').textContent='';load()};
</script>
</body>
</html>
